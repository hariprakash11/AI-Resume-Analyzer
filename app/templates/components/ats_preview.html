<div class="ats-card">

    <!-- Card Header -->
    <div class="ats-header">

        <div class="ats-heading">

            <span class="ats-label">
                Resume Analysis
            </span>

            <h3>
                ATS Compatibility
            </h3>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            AI Ready
        </div>

    </div>


    <!-- ATS Gauge -->
    <div class="gauge-area">

        <div class="gauge">

            <svg
                class="progress-ring"
                viewBox="0 0 190 190"
                aria-label="ATS score 92 percent">

                <defs>

                    <linearGradient
                        id="atsGradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">

                        <stop
                            offset="0%"
                            stop-color="#2563EB" />

                        <stop
                            offset="55%"
                            stop-color="#3B82F6" />

                        <stop
                            offset="100%"
                            stop-color="#7C3AED" />

                    </linearGradient>

                </defs>

                <!-- Background Ring -->

                <circle
                    class="progress-bg"
                    cx="95"
                    cy="95"
                    r="72">
                </circle>

                <!-- Progress Ring -->

                <circle
                    class="progress-bar"
                    cx="95"
                    cy="95"
                    r="72">
                </circle>

            </svg>


            <div class="score">

                <span class="score-number" id="atsScore">
                    0%
                </span>

                <span class="score-label">
                    Excellent
                </span>

            </div>

        </div>

    </div>


    <!-- Score Summary -->

    <div class="score-summary">

        <div>

            <span class="summary-value">
                92
            </span>

            <span class="summary-label">
                Overall Score
            </span>

        </div>

        <div>

            <span class="summary-value">
                18
            </span>

            <span class="summary-label">
                Keywords
            </span>

        </div>

        <div>

            <span class="summary-value">
                94%
            </span>

            <span class="summary-label">
                Match
            </span>

        </div>

    </div>


    <!-- Matched Skills -->

    <div class="skills">

        <div class="skills-heading">

            <h4>
                Matched Skills
            </h4>

            <span>
                6 found
            </span>

        </div>

        <div class="tags">

            <span>Python</span>
            <span>SQL</span>
            <span>Flask</span>
            <span>Git</span>
            <span>Pandas</span>
            <span>Power BI</span>

        </div>

    </div>


    <!-- Missing Keywords -->

    <div class="skills">

        <div class="skills-heading">

            <h4>
                Recommended Keywords
            </h4>

            <span>
                Improve score
            </span>

        </div>

        <div class="tags warning">

            <span>Docker</span>
            <span>AWS</span>
            <span>React</span>

        </div>

    </div>

</div>
